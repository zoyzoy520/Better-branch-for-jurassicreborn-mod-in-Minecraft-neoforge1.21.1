org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true

# Route Gradle traffic through the local system proxy (127.0.0.1:7892, Clash-style)
# because maven.neoforged.net / api.foojay.io are blocked on direct connections.
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7892
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7892

group=net.example.jrtameall
version=1.0.0
