[[mods]]
modId="jr_tame_all"
version="1.3.0"
displayName="Jurassic Reborn Tame All"
description='''
Unlocks the imprinting (taming) system for ALL Jurassic Reborn dinosaur species.
Every hatched dinosaur imprints on the player who hatches it, and all species defend their owner.
Sneaking while hatching still skips imprinting.
Also adds: peace rules (tamed creatures never attack players or other tamed creatures;
pterosaurs and marine creatures never attack their own kind), a creative-only Taming Stick
to force-tame wild dinosaurs, 5x fossil grinder speed and success, 10x incubator hatch
speed and 10x embryonic machine gestation speed. Tamed dinosaurs also never get hungry
or thirsty (metabolism stays full).
1.3.0 adds riding: an adult tamed dinosaur (width >= pig) can be mounted with a
carrot on a stick right-click. Pig-style steering on land (player yaw = direction,
auto climb, sneak to dismount); marine dinosaurs breathe for the rider and dive
or climb with pitch in water; flying dinosaurs take off with jump, fly with pitch
climb/dive and flap their wings. While ridden a dinosaur never fights, sleeps or
sits down, and falling after the mount dies hurts.
'''

